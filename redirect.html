<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Voting Map</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #ECE6D6;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-family:
                Avenir,
                Arial,
                sans-serif;

            color: #1F2430;
        }
    </style>
</head>

<body>

<div class="loading">
    Loading voting map…
</div>


<script>

    const mobileBreakpoint = 768;


    if (window.innerWidth <= mobileBreakpoint) {

        window.location.replace(
            "mobile.html"
        );

    } else {

        window.location.replace(
            "index.html"
        );

    }

</script>

</body>
</html>
